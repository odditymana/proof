<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROOF</title>
  <meta name="description" content="画像の構図・配色を自分の目で確かめるためのツール。画像はブラウザ内だけで処理します。">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="logo">PROOF</h1>
    <p class="tagline">構図と配色の校正刷り</p>
  </header>

  <main class="layout">
    <section class="stage" aria-label="画像">
      <div class="stage-empty">
        <p>画像をここにドロップ<br>または「ファイルを選ぶ」</p>
      </div>
    </section>

    <aside class="panel" aria-label="計測と表示の設定">
      <section class="panel-section" aria-labelledby="h-image">
        <h2 id="h-image" class="label">画像</h2>
        <button type="button" id="file-button" class="button">ファイルを選ぶ</button>
        <input type="file" id="file-input" accept="image/*" hidden>
        <dl id="image-info" class="info" hidden>
          <dt>ファイル</dt><dd data-info="name"></dd>
          <dt>サイズ</dt><dd data-info="size"></dd>
        </dl>
        <p id="status" class="status" role="status"></p>
      </section>

      <section class="panel-section" aria-labelledby="h-grid">
        <h2 id="h-grid" class="label">比率グリッド</h2>
        <p class="placeholder">—</p>
      </section>

      <section class="panel-section" aria-labelledby="h-palette">
        <h2 id="h-palette" class="label">色の抽出</h2>
        <p class="placeholder">—</p>
      </section>
    </aside>
  </main>

  <footer class="site-footer">
    <p>画像はブラウザ内だけで処理し、外部には送信しません。</p>
  </footer>
</body>
</html>
